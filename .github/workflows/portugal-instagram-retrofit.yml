name: Portugal Instagram retrofit covers
on:
  push:
    branches: [main]
    paths:
      - "infra/portugalia-editor/instagram-retrofit-20261123.manifest.json"
      - "scripts/portugal_instagram_retrofit.py"
      - ".github/workflows/portugal-instagram-retrofit.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: portugal-instagram-retrofit-20261123
  cancel-in-progress: false
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install photo renderer
        run: python -m pip install --quiet Pillow requests
      - name: Generate titles and full-article continuation carousels
        shell: bash
        run: |
          python scripts/portugal_instagram_retrofit.py || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('infra/portugalia-editor/instagram-retrofit-result.json')
          data=json.loads(p.read_text())
          print('RENDERED',sum(r['status']=='ready' for r in data['records']),'/',len(data['records']))
          PY
      - name: Commit public editorial JPEGs and manifest of results
        shell: bash
        run: |
          git config user.name "MyNow Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journalstudio/instagram-retrofit infra/portugalia-editor/instagram-retrofit-result.json
          if git diff --cached --quiet; then
            echo "No new cover changes"
            exit 0
          fi
          git commit -m "assets(portugal): approved Instagram headlines and complete-text carousel covers"
          git push origin HEAD:main
      - name: Redeploy static website with generated JPEGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/publish-site.yml/dispatches" -f ref=main
          echo "Website deployment requested"
      - name: Keep a machine-readable audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portugal-instagram-retrofit-report
          path: infra/portugalia-editor/instagram-retrofit-result.json
          if-no-files-found: warn
