<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#185f54">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Convite para evento Trailyo">
<meta property="og:description" content="Descobre este evento e junta-te a nós no Trailyo">
<meta property="og:image" content="https://mynw.app/trailyo/assets/trailyo-logo.png">
<meta name="description" content="Abre este evento no Trailyo">
<link rel="icon" href="/trailyo/assets/trailyo-logo.png">
<title>Событие · Trailyo</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(155deg,#e5f2ed,#f7ede4 50%,#eff1fa);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#20313b;display:grid;place-items:center;padding:24px}
article{max-width:480px;width:100%;background:white;border-radius:24px;padding:32px;box-shadow:0 16px 60px #15363119}
.logo{width:182px;max-height:82px;object-fit:contain;object-position:left}
.tag{color:#27796e;font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;margin-top:20px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.7px;margin:10px 0 12px;overflow-wrap:anywhere}
p{margin:0 0 20px;color:#526374}
a.main{display:block;border-radius:14px;background:#1c7c69;color:#fff;padding:14px 20px;text-align:center;font-weight:700;text-decoration:none;margin:22px 0 12px}
a.secondary{color:#246e67;text-decoration:underline}
.small{font-size:13px;line-height:1.5}
.bad{display:none;color:#a13636}
</style>
<link rel="stylesheet" href="/trailyo/assets/download-actions.css?v=20261110-ios">
<script defer src="/trailyo/assets/store-links.js?v=20261110-ios"></script>
<script defer src="/assets/store-qr.js?v=20261110-trailyo-ios"></script>
<script defer src="/trailyo/assets/download-actions.js?v=20261110-ios"></script></head>
<body><article>
<a href="/trailyo/"><img class="logo" src="/trailyo/assets/trailyo-logo.png" alt="Trailyo"></a>
<div class="tag" id="badge"></div>
<h1 id="subject">Trailyo</h1>
<p id="summary"></p>
<a class="main" id="openApp" href="/trailyo/"></a>
<p class="small"><span id="fallback"></span> <a class="secondary" href="/trailyo/" id="siteLink">Trailyo</a></p>
<div class="trailyo-downloads" id="storeDownloads"></div>
<p class="bad" id="invalid"></p>
</article>
<script>
(()=>{
  const p=new URLSearchParams(location.search);
  const id=(p.get('id')||'').trim();
  const uuid=/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i;
  const lang='pt';
  const words={
    ru:{badge:"Приглашение на событие",title:"Увидимся на событии!",summary:"Тебе поделились мероприятием в Trailyo. Открой описание, дату и место в приложении.",button:"Посмотреть событие",fallback:"Нет приложения? Открой сайт",invalid:"Ссылка на приглашение некорректна."},
    en:{badge:"Event invitation",title:"Discover an event in Trailyo",summary:"Someone shared an event with you. Open Trailyo to see its date, venue and description.",button:"Open event",fallback:"Don't have the app? Visit",invalid:"This invitation link is invalid."},
    pt:{badge:"Convite para evento",title:"Descobre um evento no Trailyo",summary:"Partilharam contigo um evento. Abre no Trailyo para ver a data, o local e a descrição.",button:"Abrir evento",fallback:"Ainda não tens a app? Visita",invalid:"A ligação do convite é inválida."}
  }[lang];
  document.documentElement.lang=lang;
  document.getElementById("storeDownloads").setAttribute("data-lang",lang);
  document.getElementById('badge').textContent=words.badge;
  document.getElementById('subject').textContent=words.title;
  document.getElementById('summary').textContent=words.summary;
  document.getElementById('openApp').textContent=words.button;
  document.getElementById('fallback').textContent=words.fallback;
  if(uuid.test(id)){
    const target='trailyo://event/'+id;
    const button=document.getElementById('openApp');
    button.href=target;
    button.addEventListener('click',()=>{
      // Never auto-launch without a tap; leave a visible website fallback.
      button.textContent=words.button;
    });
  }else{
    document.getElementById('invalid').textContent=words.invalid;
    document.getElementById('invalid').style.display='block';
    document.getElementById('openApp').style.display='none';
  }
})();
</script></body></html>
