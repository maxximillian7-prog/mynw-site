<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Guest account safety — MyNow Apps</title>
<meta name="description" content="How to protect access to your data when using NowWhat or NowCook in guest mode.">
<link rel="icon" href="/assets/mynow-main-logo.webp" type="image/webp">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f9f7;color:#183029}
*{box-sizing:border-box}body{margin:0}header{max-width:710px;margin:0 auto;padding:25px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{text-decoration:none;font-weight:750;color:#216b4d}.wrap{max-width:710px;margin:32px auto;padding:0 24px}
article{background:white;box-shadow:0 14px 55px rgba(24,48,41,.06);border:1px solid #e2ebe5;border-radius:24px;padding:34px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;color:#2b8c61;font-size:.74rem;font-weight:750}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.14;margin:16px 0 18px}
p{font-size:1.04rem;line-height:1.65}.note{padding:18px;border-radius:15px;background:#eaf6ef;margin-top:20px}
.sub{color:#647a70;font-size:.88rem}.footer{margin:16px 3px;font-size:.87rem;color:#60726b}
select{border:1px solid #c7d8cd;border-radius:10px;padding:8px;font:inherit;background:white}
a{color:#216b4d}
</style>
</head>
<body>
<header><a class="brand" href="/">MyNow Apps</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></header>
<main class="wrap">
<article><div class="eyebrow" id="tag"></div><h1 id="title"></h1><p id="intro"></p>
<div class="note"><p id="specific"></p></div><p class="sub" id="footer"></p></article>
<p class="footer"><a id="back" href="/nowwhat/"></a></p>
</main>
<script>
const L={"ru":{"tag":"Информация о гостевом режиме","title":"Не потеряйте доступ к своим данным","intro":"Гостевой профиль удобен для знакомства с приложением, но после выхода, удаления приложения или смены телефона доступ к нему может быть утрачен.","nw":"В NowWhat откройте меню → «Конфиденциальность и аккаунт» и выберите «Привязать e-mail» или «Привязать Google». Завершите подтверждение до выхода из гостевого профиля.","nc":"В NowCook регистрация доступна на экране входа. Но перенос данных уже созданного гостевого профиля в зарегистрированный аккаунт в вашей версии может быть недоступен. Не выходите из гостевого аккаунта, пока не сохраните важную информацию.","footer":"Это информационная страница. Она ничего не меняет в вашей учётной записи.","back":"О приложении"},"en":{"tag":"Guest mode information","title":"Keep access to your data","intro":"Guest mode is useful for getting started, but your guest account may be inaccessible after signing out, reinstalling, or changing phones.","nw":"In NowWhat, open Menu → Privacy & account and choose Link email or Link Google. Complete verification before signing out of your guest account.","nc":"NowCook lets you register on the sign-in screen. However, transferring existing guest data to a registered account may not be supported in your installed version. Do not sign out until you have safely preserved anything important.","footer":"This page is informational and does not change your account.","back":"About the app"},"pt":{"tag":"Informação sobre o modo convidado","title":"Mantenha o acesso aos seus dados","intro":"O modo convidado permite começar facilmente, mas poderá perder o acesso à conta após terminar a sessão, reinstalar a aplicação ou mudar de telemóvel.","nw":"No NowWhat, abra Menu → Privacidade e conta e escolha Associar e-mail ou Associar Google. Conclua a confirmação antes de terminar a sessão de convidado.","nc":"No NowCook, pode registar-se no ecrã de início de sessão. No entanto, a transferência dos dados existentes do modo convidado para uma conta registada poderá não ser suportada na versão instalada. Não termine a sessão antes de guardar o que for importante.","footer":"Esta página é informativa e não altera a sua conta.","back":"Sobre a aplicação"},"uk":{"tag":"Інформація про гостьовий режим","title":"Збережіть доступ до своїх даних","intro":"Гостьовий режим дозволяє почати без реєстрації, але після виходу, перевстановлення застосунку або зміни телефона доступ може бути втрачено.","nw":"У NowWhat відкрийте Меню → Конфіденційність та обліковий запис і виберіть прив'язку електронної пошти або Google. Завершіть підтвердження, перш ніж виходити з гостьового профілю.","nc":"У NowCook реєстрація доступна на екрані входу. Проте перенесення вже створених гостьових даних до нового акаунта може не підтримуватися у вашій версії. Не виходьте з гостьового профілю, доки не збережете важливу інформацію.","footer":"Це інформаційна сторінка. Вона не змінює ваш акаунт.","back":"Про застосунок"},"es":{"tag":"Información sobre el modo invitado","title":"Conserva el acceso a tus datos","intro":"El modo invitado facilita el inicio, pero podrías perder el acceso al cerrar sesión, reinstalar la aplicación o cambiar de teléfono.","nw":"En NowWhat, abre Menú → Privacidad y cuenta y elige Vincular correo o Vincular Google. Completa la verificación antes de cerrar la sesión de invitado.","nc":"En NowCook puedes registrarte desde la pantalla de acceso. Sin embargo, es posible que tu versión no permita transferir los datos existentes del perfil invitado. No cierres sesión hasta haber guardado la información importante.","footer":"Esta página es informativa y no modifica tu cuenta.","back":"Acerca de la app"},"fr":{"tag":"Informations sur le mode invité","title":"Conservez l'accès à vos données","intro":"Le mode invité permet de commencer facilement, mais l'accès au compte peut être perdu après une déconnexion, une réinstallation ou un changement de téléphone.","nw":"Dans NowWhat, ouvrez Menu → Confidentialité et compte, puis choisissez Associer un e-mail ou Associer Google. Terminez la confirmation avant de vous déconnecter.","nc":"Dans NowCook, vous pouvez créer un compte sur l'écran de connexion. Toutefois, le transfert des données de votre profil invité vers un compte enregistré peut ne pas être pris en charge par votre version. Ne vous déconnectez pas avant d'avoir conservé les informations importantes.","footer":"Cette page est informative et ne modifie pas votre compte.","back":"À propos de l'application"},"de":{"tag":"Informationen zum Gastmodus","title":"Bewahre den Zugriff auf deine Daten","intro":"Im Gastmodus kannst du schnell starten. Nach dem Abmelden, einer Neuinstallation oder einem Gerätewechsel kann der Zugriff auf dein Gastkonto jedoch verloren gehen.","nw":"Öffne in NowWhat Menü → Datenschutz und Konto und wähle E-Mail verknüpfen oder Google verknüpfen. Schließe die Bestätigung ab, bevor du dich abmeldest.","nc":"In NowCook kannst du dich auf dem Anmeldebildschirm registrieren. Die Übertragung bereits gespeicherter Gastdaten auf ein registriertes Konto wird in deiner Version möglicherweise nicht unterstützt. Melde dich nicht ab, bevor du wichtige Informationen gesichert hast.","footer":"Diese Seite dient nur zur Information und ändert dein Konto nicht.","back":"Über die App"},"it":{"tag":"Informazioni sulla modalità ospite","title":"Conserva l'accesso ai tuoi dati","intro":"La modalità ospite consente di iniziare subito, ma potresti perdere l'accesso dopo la disconnessione, la reinstallazione o il cambio del telefono.","nw":"In NowWhat apri Menu → Privacy e account e scegli Collega e-mail o Collega Google. Completa la verifica prima di uscire dal profilo ospite.","nc":"In NowCook puoi registrarti dalla schermata di accesso. Tuttavia, la tua versione potrebbe non supportare il trasferimento dei dati esistenti del profilo ospite a un account registrato. Non uscire finché non hai salvato le informazioni importanti.","footer":"Questa pagina è informativa e non modifica il tuo account.","back":"Informazioni sull'app"}};
const app=new URLSearchParams(location.search).get('app')==='nowcook'?'nowcook':'nowwhat';
const qs=new URLSearchParams(location.search);
const current=qs.get('lang')||navigator.language.split('-')[0]||'en';
const language=L[current]?current:'en';
const select=document.getElementById('lang');select.value=language;
function render(lang){const t=L[lang]||L.en;document.documentElement.lang=lang;for(const k of ['tag','title','intro','footer','back'])document.getElementById(k).textContent=t[k];document.getElementById('specific').textContent=t[app==='nowwhat'?'nw':'nc'];const back=document.getElementById('back');back.href='/'+app+'/';}
select.addEventListener('change',()=>{render(select.value);qs.set('lang',select.value);history.replaceState(null,'',location.pathname+'?'+qs.toString())});
render(language);
</script>
</body></html>
