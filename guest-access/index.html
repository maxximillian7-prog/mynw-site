<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Guest account safety — MyNow Apps</title>
<meta name="description" content="How to protect access to your data when using NowWhat or NowCook in guest mode.">
<link rel="icon" href="/assets/mynow-main-logo.webp" type="image/webp">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f9f7;color:#183029}
*{box-sizing:border-box}body{margin:0}header{max-width:710px;margin:0 auto;padding:25px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{text-decoration:none;font-weight:750;color:#216b4d}.wrap{max-width:710px;margin:32px auto;padding:0 24px}
article{background:white;box-shadow:0 14px 55px rgba(24,48,41,.06);border:1px solid #e2ebe5;border-radius:24px;padding:34px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;color:#2b8c61;font-size:.74rem;font-weight:750}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.14;margin:16px 0 18px}
p{font-size:1.04rem;line-height:1.65}.note{padding:18px;border-radius:15px;background:#eaf6ef;margin-top:20px}
.sub{color:#647a70;font-size:.88rem}.footer{margin:16px 3px;font-size:.87rem;color:#60726b}
select{border:1px solid #c7d8cd;border-radius:10px;padding:8px;font:inherit;background:white}
a{color:#216b4d}

body[data-app="nowwhat"]{background:linear-gradient(165deg,#faf9ff,#ebedff 64%,#f9faff);color:#2c2d55}
body[data-app="nowwhat"] .brand,body[data-app="nowwhat"] a{color:#6266b3}
body[data-app="nowwhat"] .eyebrow{color:#6266b3}
body[data-app="nowwhat"] .note{background:#eeeeff}
body[data-app="nowwhat"] article{border-color:#dedfff;box-shadow:0 16px 55px #7974ae1a}
body[data-app="nowcook"]{background:linear-gradient(165deg,#fffaf0,#ffecd1 64%,#fff8e8);color:#593b22}
body[data-app="nowcook"] .brand,body[data-app="nowcook"] a{color:#ac641c}
body[data-app="nowcook"] .eyebrow{color:#b56a17}
body[data-app="nowcook"] .note{background:#fff1d9}
body[data-app="nowcook"] article{border-color:#ffdfaf;box-shadow:0 16px 55px #a56c231b}
.credits{padding:14px 16px;margin-top:15px;border-radius:14px;font-weight:620;background:#fafaff;border:1px solid #e7e7f9}
body[data-app="nowcook"] .credits{background:#fffaf2;border-color:#ffe4bd}
</style>
</head>
<body>
<header><a class="brand" href="/">MyNow Apps</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></header>
<main class="wrap">
<article><div class="eyebrow" id="tag"></div><h1 id="title"></h1><p id="intro"></p>
<div class="note"><p id="specific"></p></div><div class="credits" id="credits"></div><p class="sub" id="footer"></p></article>
<p class="footer"><a id="back" href="/nowwhat/"></a></p>
</main>
<script>
const L={"ru":{"tag":"Информация о гостевом режиме","title":"Не потеряйте доступ к своим данным","intro":"Гостевой профиль удобен для знакомства с приложением, но после выхода, удаления приложения или смены телефона доступ к нему может быть утрачен.","nw":"В NowWhat откройте меню → «Конфиденциальность и аккаунт» и выберите «Привязать e-mail» или «Привязать Google». Завершите подтверждение до выхода из гостевого профиля.","nc":"В NowCook регистрация доступна на экране входа. Но перенос данных уже созданного гостевого профиля в зарегистрированный аккаунт в вашей версии может быть недоступен. Не выходите из гостевого аккаунта, пока не сохраните важную информацию.","footer":"Это информационная страница. Она ничего не меняет в вашей учётной записи.","back":"О приложении","credits":{"nw":"В бесплатном плане NowWhat доступны 30 кредитов в месяц для ИИ-функций. Привязка гостевого аккаунта к e-mail или Google поможет сохранить доступ к этому плану и вашим данным.","nc":"После регистрации в NowCook можно пользоваться бесплатными лимитами рецептов и ИИ-функций."}},"en":{"tag":"Guest mode information","title":"Keep access to your data","intro":"Guest mode is useful for getting started, but your guest account may be inaccessible after signing out, reinstalling, or changing phones.","nw":"In NowWhat, open Menu → Privacy & account and choose Link email or Link Google. Complete verification before signing out of your guest account.","nc":"NowCook lets you register on the sign-in screen. However, transferring existing guest data to a registered account may not be supported in your installed version. Do not sign out until you have safely preserved anything important.","footer":"This page is informational and does not change your account.","back":"About the app","credits":{"nw":"NowWhat's Free plan includes 30 monthly credits for AI features. Linking your guest account to email or Google helps preserve your access and data.","nc":"After registering with NowCook, you can use the Free plan's recipe and AI allowances."}},"pt":{"tag":"Informação sobre o modo convidado","title":"Mantenha o acesso aos seus dados","intro":"O modo convidado permite começar facilmente, mas poderá perder o acesso à conta após terminar a sessão, reinstalar a aplicação ou mudar de telemóvel.","nw":"No NowWhat, abra Menu → Privacidade e conta e escolha Associar e-mail ou Associar Google. Conclua a confirmação antes de terminar a sessão de convidado.","nc":"No NowCook, pode registar-se no ecrã de início de sessão. No entanto, a transferência dos dados existentes do modo convidado para uma conta registada poderá não ser suportada na versão instalada. Não termine a sessão antes de guardar o que for importante.","footer":"Esta página é informativa e não altera a sua conta.","back":"Sobre a aplicação","credits":{"nw":"O plano gratuito do NowWhat inclui 30 créditos mensais para funções de IA. Associar a conta de convidado ao e-mail ou Google ajuda a manter o acesso e os seus dados.","nc":"Depois de se registar no NowCook, pode utilizar os limites gratuitos para receitas e funções de IA."}},"uk":{"tag":"Інформація про гостьовий режим","title":"Збережіть доступ до своїх даних","intro":"Гостьовий режим дозволяє почати без реєстрації, але після виходу, перевстановлення застосунку або зміни телефона доступ може бути втрачено.","nw":"У NowWhat відкрийте Меню → Конфіденційність та обліковий запис і виберіть прив'язку електронної пошти або Google. Завершіть підтвердження, перш ніж виходити з гостьового профілю.","nc":"У NowCook реєстрація доступна на екрані входу. Проте перенесення вже створених гостьових даних до нового акаунта може не підтримуватися у вашій версії. Не виходьте з гостьового профілю, доки не збережете важливу інформацію.","footer":"Це інформаційна сторінка. Вона не змінює ваш акаунт.","back":"Про застосунок","credits":{"nw":"Безкоштовний план NowWhat включає 30 кредитів на місяць для функцій ШІ. Прив’язка гостьового акаунта до e-mail або Google допоможе зберегти доступ і дані.","nc":"Після реєстрації в NowCook можна користуватися безкоштовними лімітами рецептів і функцій ШІ."}},"es":{"tag":"Información sobre el modo invitado","title":"Conserva el acceso a tus datos","intro":"El modo invitado facilita el inicio, pero podrías perder el acceso al cerrar sesión, reinstalar la aplicación o cambiar de teléfono.","nw":"En NowWhat, abre Menú → Privacidad y cuenta y elige Vincular correo o Vincular Google. Completa la verificación antes de cerrar la sesión de invitado.","nc":"En NowCook puedes registrarte desde la pantalla de acceso. Sin embargo, es posible que tu versión no permita transferir los datos existentes del perfil invitado. No cierres sesión hasta haber guardado la información importante.","footer":"Esta página es informativa y no modifica tu cuenta.","back":"Acerca de la app","credits":{"nw":"El plan gratuito de NowWhat incluye 30 créditos al mes para funciones de IA. Vincular tu cuenta de invitado al correo o a Google te ayuda a conservar el acceso y los datos.","nc":"Tras registrarte en NowCook, puedes usar las cuotas gratuitas de recetas y funciones de IA."}},"fr":{"tag":"Informations sur le mode invité","title":"Conservez l'accès à vos données","intro":"Le mode invité permet de commencer facilement, mais l'accès au compte peut être perdu après une déconnexion, une réinstallation ou un changement de téléphone.","nw":"Dans NowWhat, ouvrez Menu → Confidentialité et compte, puis choisissez Associer un e-mail ou Associer Google. Terminez la confirmation avant de vous déconnecter.","nc":"Dans NowCook, vous pouvez créer un compte sur l'écran de connexion. Toutefois, le transfert des données de votre profil invité vers un compte enregistré peut ne pas être pris en charge par votre version. Ne vous déconnectez pas avant d'avoir conservé les informations importantes.","footer":"Cette page est informative et ne modifie pas votre compte.","back":"À propos de l'application","credits":{"nw":"Le forfait gratuit de NowWhat inclut 30 crédits par mois pour les fonctions d'IA. Associer votre compte invité à un e-mail ou à Google aide à conserver vos données et votre accès.","nc":"Après l'inscription à NowCook, vous pouvez utiliser les quotas gratuits de recettes et de fonctions d'IA."}},"de":{"tag":"Informationen zum Gastmodus","title":"Bewahre den Zugriff auf deine Daten","intro":"Im Gastmodus kannst du schnell starten. Nach dem Abmelden, einer Neuinstallation oder einem Gerätewechsel kann der Zugriff auf dein Gastkonto jedoch verloren gehen.","nw":"Öffne in NowWhat Menü → Datenschutz und Konto und wähle E-Mail verknüpfen oder Google verknüpfen. Schließe die Bestätigung ab, bevor du dich abmeldest.","nc":"In NowCook kannst du dich auf dem Anmeldebildschirm registrieren. Die Übertragung bereits gespeicherter Gastdaten auf ein registriertes Konto wird in deiner Version möglicherweise nicht unterstützt. Melde dich nicht ab, bevor du wichtige Informationen gesichert hast.","footer":"Diese Seite dient nur zur Information und ändert dein Konto nicht.","back":"Über die App","credits":{"nw":"Der kostenlose NowWhat-Tarif enthält 30 monatliche Credits für KI-Funktionen. Verknüpfe dein Gastkonto mit E-Mail oder Google, um deinen Zugriff und deine Daten zu behalten.","nc":"Nach der Registrierung bei NowCook kannst du die kostenlosen Kontingente für Rezepte und KI-Funktionen nutzen."}},"it":{"tag":"Informazioni sulla modalità ospite","title":"Conserva l'accesso ai tuoi dati","intro":"La modalità ospite consente di iniziare subito, ma potresti perdere l'accesso dopo la disconnessione, la reinstallazione o il cambio del telefono.","nw":"In NowWhat apri Menu → Privacy e account e scegli Collega e-mail o Collega Google. Completa la verifica prima di uscire dal profilo ospite.","nc":"In NowCook puoi registrarti dalla schermata di accesso. Tuttavia, la tua versione potrebbe non supportare il trasferimento dei dati esistenti del profilo ospite a un account registrato. Non uscire finché non hai salvato le informazioni importanti.","footer":"Questa pagina è informativa e non modifica il tuo account.","back":"Informazioni sull'app","credits":{"nw":"Il piano gratuito di NowWhat include 30 crediti mensili per le funzioni IA. Collegare il profilo ospite a e-mail o Google aiuta a mantenere l'accesso e i dati.","nc":"Dopo la registrazione a NowCook, puoi usare le quote gratuite per ricette e funzioni IA."}}};
const app=new URLSearchParams(location.search).get('app')==='nowcook'?'nowcook':'nowwhat';document.body.dataset.app=app;
const qs=new URLSearchParams(location.search);
const current=qs.get('lang')||navigator.language.split('-')[0]||'en';
const language=L[current]?current:'en';
const select=document.getElementById('lang');select.value=language;
function render(lang){const t=L[lang]||L.en;document.documentElement.lang=lang;for(const k of ['tag','title','intro','footer','back'])document.getElementById(k).textContent=t[k];document.getElementById('specific').textContent=t[app==='nowwhat'?'nw':'nc'];document.getElementById('credits').textContent=t.credits[app==='nowwhat'?'nw':'nc'];const back=document.getElementById('back');back.href='/'+app+'/';}
select.addEventListener('change',()=>{render(select.value);qs.set('lang',select.value);history.replaceState(null,'',location.pathname+'?'+qs.toString())});
render(language);
</script>
</body></html>
