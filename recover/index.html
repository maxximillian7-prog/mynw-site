<script>
const recoveryState=(()=>{
const q=new URLSearchParams(location.search);
const h=new URLSearchParams(location.hash.slice(1));
const token=h.get('type')==='recovery'?h.get('access_token'):null;
const bad=h.has('error')||q.has('error')||q.has('error_code')||q.has('code');
const app=['nowcook','nowgreen'].includes(q.get('app'))?q.get('app'):null;
const lang=q.get('lang');
const safe=new URLSearchParams();
if(app)safe.set('app',app);if(['en','pt','ru','uk','fr','es','de','it'].includes(lang))safe.set('lang',lang);
if(location.hash||bad)history.replaceState(null,'',location.pathname+(safe.toString()?'?'+safe:''));
return {token,bad,app,lang};
})();

const A={"nowcook":{"name":"NowCook","ref":"kmbpxbkumocsboqrcjqw","key":"sb_publishable_MlHc8r8Th6VFHIxkYqTKAA_-5f1Lm6W","logo":"/assets/brand/nowcook-logo.webp","banner":"/assets/brand/nowcook-banner.webp","home":"/nowcook/"},"nowgreen":{"name":"NowGreen","ref":"dekiwkxajjgajixniaox","key":"sb_publishable_jmwuFhiQQA8stsj_33ydBw_26jn1RlH","logo":"/assets/brand/nowgreen-logo.webp","banner":"/assets/brand/nowgreen-banner.webp","home":"/nowgreen/"}};
const get=id=>document.getElementById(id);
const normalize=s=>{const l=String(s||'').toLowerCase().split(/[-_]/)[0];return Object.hasOwn(T,l)?l:null};
let app=recoveryState.app||'nowgreen';
let lang=normalize(recoveryState.lang)||(navigator.languages||[navigator.language]).map(normalize).find(Boolean)||'en';
let mode=recoveryState.token?'change':recoveryState.bad?'error':'request';
let accessToken=recoveryState.token;
let busy=false;
const cfg=()=>A[app],t=()=>T[lang];
function message(txt,error){get('notice').textContent=txt||'';get('notice').classList.toggle('error',!!error);}
function render(){
 const a=t(),c=cfg();document.documentElement.lang=lang;document.body.dataset.app=app;
 get('app').value=app;get('lang').value=lang;get('appName').textContent=c.name;
 get('logo').src=c.logo;get('home').href=c.home;get('back').href=c.home;get('back').textContent=a[20];get('help').textContent=a[22];
 get('art').style.backgroundImage='url("'+c.banner+'")';get('artlogo').src=c.logo;get('artName').textContent=c.name;
 get('sub').textContent=a[0];
 get('title').textContent=mode==='request'?a[1]:mode==='sent'?a[6]:mode==='change'?a[8]:mode==='done'?a[12]:a[16];
 get('intro').textContent=mode==='request'?a[2]:mode==='sent'?a[7]:mode==='change'?a[14]:mode==='done'?a[13]:'';
 get('request').classList.toggle('hidden',mode!=='request');
 get('change').classList.toggle('hidden',mode!=='change');
 get('retry').classList.toggle('hidden',!['error','done'].includes(mode));
 get('retry').textContent=a[21];get('emailLabel').textContent=a[3];get('send').textContent=a[4];
 get('passLabel').textContent=a[9];get('againLabel').textContent=a[10];get('save').textContent=a[11];
 get('note').textContent=mode==='request'?a[5]:'';
 document.title=get('title').textContent+' — '+c.name;
}
function rewrite(){const p=new URLSearchParams();p.set('app',app);p.set('lang',lang);history.replaceState(null,'',location.pathname+'?'+p);}
get('app').onchange=()=>{if(busy||mode==='change'){get('app').value=app;return;}app=get('app').value;mode='request';message('');render();rewrite();};
get('lang').onchange=()=>{lang=get('lang').value;render();rewrite()};
get('retry').onclick=e=>{e.preventDefault();accessToken=null;mode='request';message('');render();rewrite();};
get('request').onsubmit=async e=>{
 e.preventDefault();if(busy)return;const a=t(),email=get('email').value.trim();
 if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){message(a[17],true);return;}
 busy=true;get('send').disabled=true;message('');
 try{
 const c=cfg();const url='https://'+c.ref+'.supabase.co/auth/v1/recover?redirect_to='+encodeURIComponent('https://mynw.app/recover/?app='+app);
 const response=await fetch(url,{method:'POST',cache:'no-store',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({email})});
 if(response.status===429)message(a[18],true);
 else if(response.ok){mode='sent';render();message(a[5]);}
 else message(a[19],true);
 }catch(_){message(a[19],true);}finally{busy=false;get('send').disabled=false;}
};
get('change').onsubmit=async e=>{
 e.preventDefault();if(busy||!accessToken)return;const a=t(),pass=get('pass').value;
 if(pass.length<12){message(a[14],true);return;}if(pass!==get('again').value){message(a[15],true);return;}
 busy=true;get('save').disabled=true;message('');
 try{
 const c=cfg(),response=await fetch('https://'+c.ref+'.supabase.co/auth/v1/user',{method:'PUT',cache:'no-store',headers:{'apikey':c.key,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
 if(response.ok){accessToken=null;get('pass').value='';get('again').value='';mode='done';render();rewrite();}
 else if([401,403].includes(response.status)){accessToken=null;mode='error';render();message(a[16],true);}
 else if(response.status===429)message(a[18],true);
 else message(a[19],true);
 }catch(_){message(a[19],true);}finally{busy=false;get('save').disabled=false;}
};
render();
})();
